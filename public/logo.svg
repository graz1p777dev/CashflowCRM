<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cashflow">
  <!-- Знак Cashflow: тёмно-фиолетовый круг палитры (#430C61) и золотая
       монограмма «C» градиентом логотипа (#F4A300 → #FFD42A). -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD42A"/>
      <stop offset="1" stop-color="#F4A300"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#430C61"/>
      <stop offset="1" stop-color="#2C0740"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#plum)"/>
  <path d="M43 22.5a15 15 0 1 0 0 19"
        fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  <!-- Вертикаль денежного знака: та же золотая нить, что и в «C». -->
  <path d="M32 12v40" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
</svg>
